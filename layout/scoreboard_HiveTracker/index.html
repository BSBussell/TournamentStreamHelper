<html>
    <head>
        <meta charset="utf-8" />
        <title>HiveTracker</title>
        <script src="../include/globals.js"></script>
        <link rel="stylesheet" href="../main.css" />
        <link rel="stylesheet" href="./index.css" />
        <link rel="stylesheet" href="./hive.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Kanit:wght@800&family=M+PLUS+1:wght@800&display=swap"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Righteous&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="ssbu">
        <img src="../logo.png" class="logo fade"></img>

        <div class="tournament_logo hidden unhidden"></div>

        <div class="topleft_container fade_right">
            <div class="match_container">
                <div class="match"></div>
            </div>
        </div>
        <div class="info chips fade_right">
            <div class="phase_container chip">
                <div class="phase"></div>
            </div>
        </div>

        <div class="p1 container fade_right"><svg class="hive-trim" viewBox="0 0 488 70" aria-hidden="true"><path class="honey-line" d="M88 9H463M95 60H466"/><path class="honey-drip" d="M99 59v6m7-6v3"/></svg>
            <div class="placeholder_container"></div>
            <div class="edge"><svg class="hive-frame" viewBox="0 0 88 76" aria-hidden="true"><path class="outer" d="M22 2H66L86 38 66 74H22L2 38Z"/><path class="inner" d="M24 7H64L81 38 64 69H24L7 38Z"/><path class="shine" d="M8 34 24 7H62M65 69H25"/></svg>
                <div class="fallback-portrait" aria-hidden="true"><img class="fallback-portrait-image" src="./player-placeholder.svg" alt="" /></div>
                <div class="p1 character_container hidden unhidden"></div>
            </div>
            <div class="name"></div>
            <div class="sponsor_icon"></div>
            <div class="border container"></div>
            <div class="score_container">
                <div class="score"></div>
            </div>
        </div>
        <div class="hive-shadow-layer hive-shadow-p1 fade_right" aria-hidden="true"><svg class="hive-shadow" viewBox="0 0 101 87"><path d="M28 1H73Q76 1 78 5L99 39Q101 43.5 99 48L78 82Q76 86 72 86H29Q25 86 23 82L2 48Q0 43.5 2 39L23 5Q25 1 28 1Z"/></svg></div>

        <div class="p1 under_chips">
            <div class="seed chip fade_stagger_reverse"></div>
            <div class="twitter chip fade_stagger_reverse"></div>
            <div class="pronoun chip fade_stagger_reverse"></div>
            <div class="flagstate chip fade_stagger_reverse"></div>
            <div class="flagcountry chip fade_stagger_reverse"></div>
        </div>

        <div class="p1 chips">
            <div class="seed chip fade_stagger_reverse"></div>
            <div class="twitter chip fade_stagger_reverse"></div>
            <div class="pronoun chip fade_stagger_reverse"></div>
            <div class="flagstate chip fade_stagger_reverse"></div>
            <div class="flagcountry chip fade_stagger_reverse"></div>
        </div>

        <div class="p1 light hidden"><div></div></div>
        <div class="p1 bg hidden unhidden"><div></div></div>

        <div class="p2 container fade_left"><svg class="hive-trim" viewBox="0 0 488 70" aria-hidden="true"><path class="honey-line" d="M88 9H463M95 60H466"/><path class="honey-drip" d="M99 59v6m7-6v3"/></svg>
            <div class="placeholder_container"></div>
            <div class="edge"><svg class="hive-frame" viewBox="0 0 88 76" aria-hidden="true"><path class="outer" d="M22 2H66L86 38 66 74H22L2 38Z"/><path class="inner" d="M24 7H64L81 38 64 69H24L7 38Z"/><path class="shine" d="M8 34 24 7H62M65 69H25"/></svg>
                <div class="fallback-portrait" aria-hidden="true"><img class="fallback-portrait-image" src="./player-placeholder.svg" alt="" /></div>
                <div class="p2 character_container hidden unhidden"></div>
            </div>
            <div class="name"></div>
            <div class="sponsor_icon"></div>
            <div class="border container"></div>
            <div class="score_container">
                <div class="score"></div>
            </div>
        </div>
        <div class="hive-shadow-layer hive-shadow-p2 fade_left" aria-hidden="true"><svg class="hive-shadow" viewBox="0 0 101 87"><path d="M28 1H73Q76 1 78 5L99 39Q101 43.5 99 48L78 82Q76 86 72 86H29Q25 86 23 82L2 48Q0 43.5 2 39L23 5Q25 1 28 1Z"/></svg></div>

        <div class="p2 under_chips">
            <div class="seed chip fade_stagger_reverse"></div>
            <div class="twitter chip fade_stagger_reverse"></div>
            <div class="pronoun chip fade_stagger_reverse"></div>
            <div class="flagstate chip fade_stagger_reverse"></div>
            <div class="flagcountry chip fade_stagger_reverse"></div>
        </div>

        <div class="p2 chips">
            <div class="seed chip fade_stagger_reverse"></div>
            <div class="twitter chip fade_stagger_reverse"></div>
            <div class="pronoun chip fade_stagger_reverse"></div>
            <div class="flagstate chip fade_stagger_reverse"></div>
            <div class="flagcountry chip fade_stagger_reverse"></div>
        </div>

        <div class="p2 light hidden"><div></div></div>
        <div class="p2 bg hidden unhidden"><div></div></div>

        <div class="dark score_boxes"></div>
        <div class="blue score_boxes"></div>
        <div class="red score_boxes"></div>
        <div class="word score_boxes"></div>

        <script src="index.js"></script>
    </body>
</html>
