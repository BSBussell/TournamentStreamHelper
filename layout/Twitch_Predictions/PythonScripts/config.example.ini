[Twitch]
; Your Twitch API credentials
access_token = YOUR_ACCESS_TOKEN
client_id = YOUR_CLIENT_ID

; The broadcaster_id will be automatically obtained if not provided
broadcaster_id = 

[TSH]
; Path to the TSH output directory (relative to script location)
tsh_out = ../../../out/

; The time in seconds until the prediction closes
; Default is 10 minutes (600 seconds)
prediction_time = 600
