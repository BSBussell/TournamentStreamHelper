<html>

<head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
</head>

<body>

    <div class="prediction-overlay">
        <div class="prediction-names">
            <div class="p1-container">
                <span id="p1-name"></span>
                <span class="left detail">13 Gamblers</span>
                <div class="mini-left mini-bar" id="bar-left">
                    <div class="p1-score">60,000</div>
                    <span class="gims">GLRA GIMMS</span>
                </div>
                
            </div>
            <div class="center">
                <span class="center ">GAMBLING!</span>
            </div>
            <div class="p2-container">
                <span id="p2-name"></span>
                <span class="right detail">6 Gamblers</span>
                <div class="mini-right mini-bar" id="bar-right">
                    <span class="gims">GLRA GIMMS</span>
                    <div class="p2-score">40,000</div>
                </div>
            </div>
        </div>
        <div class="prediction-bar">
            <div class="bar-left leading" id="bar-left">
            <span class="bar-label" id="left-percent">60%</span>
            </div>
            <div class="bar-right" id="bar-right">
            <span class="bar-label" id="right-percent">40%</span>
            </div>
        </div>
        
    </div>
    <script>
        window.hide_names = false;
        window.hide_sponsor = true;
        window.hide_count = false;
        window.bar_only = false;
        window.hide_percent = false;
    </script>
    <script src="index.js"></script>
</body>
