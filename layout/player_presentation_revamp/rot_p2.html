<html>
    <head>
        <meta charset="utf-8" />
        <script src="../include/globals.js"></script>
        <link rel="stylesheet" href="../main.css" />
        <link rel="stylesheet" href="./index.css" />
    </head>
    <body>
        <div class="stage"></div>

        <!--
    <div class="info">
      <div class="tournament"></div>
      <div class="match"></div>
      <div class="phase_best_of"></div>
    </div>
    -->

        <div class="p2 player container">
            <div class="sponsor_logo"></div>
            <!-- <div class="character_name"></div> -->

            <div class="player_col">
                <div class="name_row">
                    <div class="name"></div>
                    <div class="flagscontainer">
                        <div class="flagcountry"></div>
                        <div class="flagstate"></div>
                    </div>
                </div>
                <div class="real_name"></div>
                <div class="info_grid">
                    <div class="pronoun"></div>
                    <div class="twitter"></div>
                    <div class="seed"></div>
                </div>
            </div>

            <div class="score"></div>
            <div class="losers_badge">LOSERS</div>
        </div>

        <div class="p2 character"></div>

        <!-- Content panels that will be switched -->
        <div class="p2 content-panels">
            <!-- Recent tournament results panel -->
            <div class="content-panel" id="tournament-results">
                <div class="p2 results"></div>
            </div>
            
            <!-- Fun facts panel -->
            <div class="content-panel" id="fun-facts">
                <div class="p2 facts"></div>
            </div>
        </div>
        
        <div class="p2 sets"></div>

        <script>
            window.PLAYER = 2;
            window.START_WITH_FACTS = false; // Set the default starting panel
            window.ROTATE = false; // Set to true to enable rotation
            window.PANEL_ROTATION_INTERVAL = 100; // Set the interval for panel rotation (in seconds)
        </script>
        <script src="index.js"></script>
    </body>
</html>
