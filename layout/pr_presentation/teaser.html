<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <script src="../include/globals.js"></script>
        <link rel="stylesheet" href="../main.css" />
        <link rel="stylesheet" href="https://use.typekit.net/etk2xhj.css" />
        <link rel="stylesheet" href="./theme.css?v=1" />
        <link rel="stylesheet" href="./index.css?v=33" />
        <style>
            body {
                opacity: 1 !important;
            }

            .teaser-event-line {
                margin: 26px auto 0;
                width: fit-content;
                padding: 10px 22px 9px;
                color: #10152e;
                font-family: "Roboto Condensed", var(--font);
                font-size: 34px;
                font-weight: 900;
                line-height: 1;
                letter-spacing: 0;
                text-transform: uppercase;
                background:
                    linear-gradient(90deg, color-mix(in srgb, var(--starlight) 84%, white 16%), color-mix(in srgb, var(--moon-gold) 70%, var(--starlight) 30%));
                border-radius: 8px;
                box-shadow:
                    inset 0 1px 0 rgba(255, 255, 255, 0.48),
                    0 0 24px color-mix(in srgb, var(--moon-gold) 34%, transparent),
                    0 6px 18px rgba(7, 11, 24, 0.46);
            }
        </style>
    </head>
    <body>
        <div class="stage"></div>
        <main class="pr-scene">
            <section class="teaser-screen" aria-label="East Tennessee Spring 2026 PR reveal stream announcement">
                <div class="teaser-bg-collage" aria-hidden="true"></div>
                <div class="teaser-energy" aria-hidden="true"></div>
                <div class="teaser-embers" aria-hidden="true"></div>
                <section class="teaser-panel">
                    <div class="teaser-kicker">EAST TENNESSEE SPRING 2026</div>
                    <h1 class="teaser-title">PR REVEAL STREAM</h1>
                    <div class="teaser-subtitle">TOMORROW NIGHT</div>
                    <p class="teaser-event-line">on TNHive at 6PM</p>
                </section>
            </section>
        </main>
    </body>
</html>
